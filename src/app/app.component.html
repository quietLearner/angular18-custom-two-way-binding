<div id="inputs">
  <p>
    <label>Width</label>
    <input
      type="number"
      step="1.0"
      [ngModel]="rectSize().width"
      (ngModelChange)="updateDimension('width', $event)"
    />
  </p>
  <p>
    <label>Height</label>
    <input
      type="number"
      step="1.0"
      [ngModel]="rectSize().height"
      (ngModelChange)="updateDimension('height', $event)"
    />
  </p>
</div>
<app-rect [(size)]="rectSize" />
